<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Standard 2-Color Architecture: Deep Institutional Navy (#0F2744) & Pure White (#FFFFFF) -->
  <!-- Outer Solid Squircle Base (Color 1: Institutional Navy) -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0F2744" stroke="#1E3A8A" stroke-width="1.5" />
  
  <!-- Academic Chevron & Campus Beacon (Color 2: Pure Crisp White) -->
  <g transform="translate(4, 3)">
    <!-- Academic Chevron Roof -->
    <path d="M20 9 L32 15 L20 21 L8 15 Z" fill="#FFFFFF" />
    
    <!-- Institutional Arch Columns -->
    <path d="M12 22 L12 29 C12 33.4 15.6 37 20 37 C24.4 37 28 33.4 28 29 L28 22" 
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Core Dispatch Transmitter & Signal Arc -->
    <circle cx="20" cy="27" r="2.8" fill="#FFFFFF" />
    <path d="M15.5 27 C15.5 24.5 17.5 22.5 20 22.5 C22.5 22.5 24.5 24.5 24.5 27" 
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
